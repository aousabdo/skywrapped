name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (the cli extra, so the PNG tests run)
        run: python -m pip install -e ".[cli,dev]"
      - name: Test
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - name: Install the package (the smoke test runs the command line for comparison)
        run: python -m pip install -e .
      - name: Build the wheel and _site
        run: |
          python -m pip install --upgrade build
          python scripts/build_web.py
      - name: Node smoke test
        env:
          SKYWRAPPED_PYTHON: python
        run: |
          cd tests/web
          npm ci
          node smoke.mjs ../../_site

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: twine check --strict
        run: python -m twine check --strict dist/*
      - name: Wheel size (at most 2 MB)
        run: |
          size=$(stat -c %s dist/*.whl)
          echo "wheel: ${size} bytes"
          test "${size}" -le 2000000
